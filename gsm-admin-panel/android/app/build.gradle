apply plugin: 'com.android.application'

// Wersja aplikacji = "version" z gsm-admin-panel/package.json (jedno źródło
// prawdy dla PWA i Androida). versionCode liczony z semver: 1.2.3 → 10203,
// więc każda wyższa wersja daje wyższy kod (wymóg aktualizacji na telefonie).
def appVersionName = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def appVersionParts = appVersionName.tokenize('.-+')
def appVersionCode = appVersionParts[0].toInteger() * 10000 + appVersionParts[1].toInteger() * 100 + appVersionParts[2].toInteger()

// Podpis release – dane NIGDY w repo. Źródła (pierwsze znalezione wygrywa):
//   1) android/keystore.properties (ignorowany przez git; wzór: keystore.properties.example)
//   2) zmienne środowiskowe FX_KEYSTORE_FILE, FX_KEYSTORE_PASSWORD, FX_KEY_ALIAS, FX_KEY_PASSWORD
// Bez nich release buduje się niepodpisany (debug działa zawsze).
def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def signingValue = { String key, String envName -> signingProps.getProperty(key) ?: System.getenv(envName) }
def releaseStoreFile = signingValue('storeFile', 'FX_KEYSTORE_FILE')
def hasReleaseSigning = releaseStoreFile && signingValue('storePassword', 'FX_KEYSTORE_PASSWORD') &&
        signingValue('keyAlias', 'FX_KEY_ALIAS') && signingValue('keyPassword', 'FX_KEY_PASSWORD')

android {
    namespace = "pl.fonexpert.serwis"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.fonexpert.serwis"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'FX_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'FX_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'FX_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
