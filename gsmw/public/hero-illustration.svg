<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Smartfon po naprawie na macie serwisowej, obok narzędzia serwisowe</title>
  <defs>
    <linearGradient id="mat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1662E8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/><stop offset="1" stop-color="#E8F0FE"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity=".22"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- dekoracyjne koła w tle -->
  <circle cx="760" cy="210" r="165" fill="#DCE8FD"/>
  <circle cx="230" cy="120" r="90" fill="#E6EEFC"/>

  <!-- roślina w doniczce -->
  <g transform="translate(110 150)">
    <path d="M60 40 C40 -20 10 -10 0 -40 C40 -30 70 0 70 40Z" fill="#22C55E"/>
    <path d="M80 40 C85 -30 110 -50 120 -80 C130 -30 105 10 92 42Z" fill="#16A34A"/>
    <path d="M70 42 C55 0 60 -40 75 -70 C90 -40 88 0 82 42Z" fill="#4ADE80"/>
    <path d="M95 44 C120 10 150 5 170 -10 C160 25 130 45 100 50Z" fill="#22C55E"/>
    <rect x="30" y="40" width="120" height="110" rx="16" fill="url(#pot)" stroke="#CBD5E1" stroke-width="2"/>
  </g>

  <!-- mata serwisowa -->
  <g filter="url(#sh)">
    <path d="M150 360 L800 290 Q840 286 848 324 L900 560 Q906 596 868 600 L150 640 Q112 642 106 604 L104 400 Q104 364 150 360Z" fill="url(#mat)"/>
  </g>
  <g opacity=".35" fill="none" stroke="#BFDBFE" stroke-width="3">
    <path d="M150 392 L250 382 L252 430 L152 440Z"/>
    <path d="M150 458 L250 448 L252 496 L152 506Z"/>
    <path d="M150 524 L250 514 L252 562 L152 572Z"/>
  </g>
  <g opacity=".25" stroke="#DBEAFE" stroke-width="2">
    <path d="M300 368 L330 620"/><path d="M420 356 L452 612"/><path d="M540 344 L574 604"/><path d="M660 332 L696 596"/><path d="M780 320 L818 588"/>
  </g>

  <!-- smartfon po naprawie -->
  <g transform="translate(0 -48) rotate(-9 520 450)" filter="url(#sh)">
    <rect x="390" y="250" width="270" height="400" rx="40" fill="url(#body)"/>
    <rect x="404" y="264" width="242" height="372" rx="30" fill="url(#screen)"/>
    <rect x="490" y="276" width="70" height="18" rx="9" fill="#0F172A"/>
    <!-- interfejs: status naprawy -->
    <circle cx="525" cy="380" r="48" fill="#DCFCE7"/>
    <path d="M502 381 L519 398 L550 364" fill="none" stroke="#16A34A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="455" y="452" width="140" height="14" rx="7" fill="#0F172A" opacity=".85"/>
    <rect x="470" y="478" width="110" height="10" rx="5" fill="#94A3B8"/>
    <rect x="440" y="516" width="170" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="440" y="516" width="170" height="10" rx="5" fill="#1662E8"/>
    <circle cx="448" cy="550" r="6" fill="#1662E8"/><circle cx="525" cy="550" r="6" fill="#1662E8"/><circle cx="602" cy="550" r="6" fill="#1662E8"/>
    <rect x="452" y="584" width="146" height="30" rx="15" fill="#1662E8"/>
    <rect x="490" y="595" width="70" height="8" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- narzędzia leżące obok (nie dotykają telefonu) -->
  <g filter="url(#sh2)">
    <!-- śrubokręt -->
    <g transform="rotate(-24 760 470)">
      <rect x="700" y="458" width="110" height="26" rx="13" fill="#F59E0B"/>
      <rect x="712" y="458" width="10" height="26" fill="#D97706" opacity=".6"/>
      <rect x="806" y="466" width="70" height="10" rx="3" fill="#94A3B8"/>
      <path d="M876 466 L892 471 L876 476Z" fill="#64748B"/>
    </g>
    <!-- pinceta -->
    <g transform="rotate(-30 760 560)">
      <path d="M680 556 L860 548 L860 554 L690 566Z" fill="#CBD5E1"/>
      <path d="M680 556 L860 560 L860 566 L690 570Z" fill="#94A3B8"/>
    </g>
    <!-- przyssawka -->
    <g transform="translate(248 470)">
      <ellipse cx="0" cy="40" rx="46" ry="16" fill="#1E3A8A" opacity=".35"/>
      <ellipse cx="0" cy="32" rx="44" ry="15" fill="#E2E8F0"/>
      <rect x="-9" y="-10" width="18" height="44" rx="6" fill="#64748B"/>
      <circle cx="0" cy="-14" r="16" fill="#1662E8"/>
    </g>
  </g>

  <!-- drobne śrubki w pojemniku -->
  <g transform="translate(300 556)" filter="url(#sh2)">
    <rect x="0" y="0" width="90" height="46" rx="10" fill="#E2E8F0"/>
    <rect x="8" y="8" width="34" height="30" rx="6" fill="#CBD5E1"/>
    <rect x="48" y="8" width="34" height="30" rx="6" fill="#CBD5E1"/>
    <circle cx="20" cy="20" r="3" fill="#64748B"/><circle cx="30" cy="27" r="3" fill="#64748B"/>
    <circle cx="60" cy="22" r="3" fill="#64748B"/><circle cx="70" cy="29" r="3" fill="#64748B"/>
  </g>
</svg>
